# Keep the repository root: backend imports the shared research/spherex.py.
services:
  - type: web
    name: planet-x-spherex-api
    runtime: python
    plan: free
    autoDeployTrigger: "off"
    buildCommand: python -m pip install -r backend/requirements-render.txt
    startCommand: python -m backend.start
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
